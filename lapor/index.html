
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lapor kejadian - AnsepZero</title>
<meta name="theme-color" content="#0d1411">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/nav.js" defer></script>
</head>
<body>
<main class="wrap narrow">
<h1 class="ptitle">Lapor kejadian</h1>

<section>
<div class="warnbox">
<b>Laporan darurat kebakaran hutan dan lahan.</b>
Laporan akan dicatat di AnsepZero dan diteruskan melalui WhatsApp setelah kamu menekan tombol kirim.
<div id="calls" class="btns"></div>
</div>

<form id="f" class="panel" style="margin-top:14px" novalidate>
<label for="d">Apa yang terjadi?</label>
<textarea id="d" maxlength="1000" required placeholder="Contoh: ada asap tebal dan api kecil di lahan dekat jalan"></textarea>

<label>Lokasi</label>
<div class="btns" style="margin:0">
<button type="button" class="btn" id="gps">Gunakan lokasi saya (GPS)</button>
<button type="button" class="btn" id="regps" hidden>Ambil ulang</button>
</div>
<p class="note" id="gpsnote">Lokasi hanya diminta saat kamu menekan tombol di atas.</p>

<label for="lt">Nama desa atau patokan terdekat</label>
<input class="t" id="lt" maxlength="200" autocomplete="off" placeholder="Nama desa atau patokan">

<label for="ph">Foto kejadian (opsional)</label>
<input type="file" id="ph" accept="image/*">
<p class="note">Foto akan kamu lampirkan sendiri setelah WhatsApp terbuka.</p>

<input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">

<div class="btns">
<button class="btn pri" id="go" type="submit">Kirim Pesan ke Damkar</button>
</div>
<p class="note" id="msg" role="status"></p>
</form>

<div class="panel" style="margin-top:14px">
<h3>Cek status laporan</h3>
<label for="cd">Kode laporan</label>
<input class="t" id="cd" placeholder="LP-XXXXXXXXXX">
<div class="btns">
<button class="btn" id="chk" type="button">Cek</button>
</div>
<p class="note" id="st"></p>
</div>
</section>
</main>

<script type="module">
const $=id=>document.getElementById(id);
const DAMKAR_WA='6282192825967';
let pos=null;

fetch('/api/contacts')
.then(r=>r.json())
.then(({rows})=>{
  for(const c of rows){
    const n=String(c.phone_intl).replace(/\D/g,'');
    const a=document.createElement('a');
    a.className='btn pri';
    a.href=n.length<=4?'tel:'+n:'tel:+'+n;
    a.textContent='Telepon '+c.name;
    $('calls').append(a);
  }
}).catch(()=>{});

function getPos(){
  $('gpsnote').textContent='Mengambil lokasi...';

  if(!navigator.geolocation){
    $('gpsnote').textContent='GPS tidak tersedia. Isi lokasi secara manual.';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    p=>{
      pos={
        lat:p.coords.latitude,
        lng:p.coords.longitude,
        acc:p.coords.accuracy
      };
      $('gpsnote').textContent=
        `Lokasi terkunci: ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)} (akurasi sekitar ${Math.round(pos.acc)} m).`;
      $('gps').hidden=true;
      $('regps').hidden=false;
    },
    e=>{
      $('gpsnote').textContent=
        e.code===1?'Izin GPS ditolak. Isi lokasi secara manual.':'Lokasi belum didapat. Coba lagi atau isi lokasi manual.';
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

$('gps').onclick=getPos;
$('regps').onclick=getPos;

$('f').onsubmit=async e=>{
  e.preventDefault();

  const description=$('d').value.trim();
  const locationText=$('lt').value.trim();
  const photo=$('ph').files[0];
  const reportPos=pos?{...pos}:null;
  const m=$('msg');

  if(!description){
    m.textContent='Deskripsi kejadian wajib diisi.';
    return;
  }

  if(!locationText&&!reportPos){
    m.textContent='Isi nama desa atau ambil lokasi GPS terlebih dahulu.';
    return;
  }

  $('go').disabled=true;
  m.textContent='Menyimpan laporan...';

  try{
    const fd=new FormData();
    fd.set('description',description);
    fd.set('location_text',locationText);
    fd.set('website',$('web').value);

    if(reportPos){
      fd.set('lat',reportPos.lat);
      fd.set('lng',reportPos.lng);
    }

    // Foto tetap dikirim ke server sesuai mekanisme lama.
    // WhatsApp tidak bisa menerima lampiran melalui URL wa.me.
    if(photo){
      fd.set('photo',photo);
    }

    const r=await fetch('/api/reports',{
      method:'POST',
      body:fd
    });

    const j=await r.json().catch(()=>null);

    if(!r.ok||!j){
      throw new Error((j&&j.error)||'Laporan gagal disimpan. Hubungi Damkar langsung jika darurat.');
    }

    const parts=[
      '*LAPORAN KEJADIAN - ANSEPZERO*',
      '',
      '*Kode laporan:* '+j.id,
      '*Deskripsi kejadian:*',
      description,
      '',
      '*Lokasi:* '+(locationText||'Terlampir melalui GPS')
    ];

    if(reportPos){
      parts.push(
        '*Koordinat GPS:* '+reportPos.lat.toFixed(6)+', '+reportPos.lng.toFixed(6),
        '*Peta:* https://maps.google.com/?q='+reportPos.lat+','+reportPos.lng
      );
    }

    if(photo){
      parts.push(
        '',
        '*Foto:* Akan dilampirkan secara manual di WhatsApp.'
      );
    }

    parts.push(
      '',
      'Laporan dibuat melalui website AnsepZero.'
    );

    const waURL='https://wa.me/'+DAMKAR_WA+'?text='+
      encodeURIComponent(parts.join('\n'));

    m.textContent='Laporan tersimpan. Membuka WhatsApp...';

    // Membuka WhatsApp setelah laporan berhasil tersimpan.
    window.location.href=waURL;

    // Simpan kode di kolom status agar mudah dicek.
    $('cd').value=j.id;

  }catch(err){
    m.textContent=err.message;
  }finally{
    $('go').disabled=false;
  }
};

$('chk').onclick=async()=>{
  try{
    const code=$('cd').value.trim().toUpperCase();

    if(!code){
      $('st').textContent='Masukkan kode laporan terlebih dahulu.';
      return;
    }

    const r=await fetch('/api/reports/'+encodeURIComponent(code));
    const j=await r.json().catch(()=>({}));

    $('st').textContent=r.ok?'Status: '+j.status:(j.error||'Gagal memeriksa laporan.');
  }catch(e){
    $('st').textContent='Gagal memeriksa laporan.';
  }
};
</script>
</body>
</html>
