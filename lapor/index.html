
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lapor kejadian - AnsepZero</title>
<meta name="theme-color" content="#0d1411">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/nav.js" defer></script>
</head>
<body>

<main class="wrap narrow">
<h1 class="ptitle">Lapor kejadian</h1>

<section>
<div class="warnbox">
<b>Laporan lewat situs ini bukan pengganti panggilan darurat.</b>
Jika ada api atau keadaan darurat, segera hubungi pemadam.
<div id="calls" class="btns"></div>
</div>

<form id="f" class="panel" style="margin-top:14px" novalidate>

<label for="d">Apa yang terjadi?</label>
<textarea id="d" maxlength="1000" required placeholder="Contoh: ada asap tebal dan api kecil di lahan dekat jalan"></textarea>

<label>Lokasi</label>
<div class="btns" style="margin:0">
<button type="button" class="btn" id="gps">Gunakan lokasi saya (GPS)</button>
<button type="button" class="btn" id="regps" hidden>Ambil ulang</button>
</div>

<p class="note" id="gpsnote">Lokasi hanya diminta saat kamu menekan tombol di atas.</p>

<label for="lt">Nama desa atau patokan terdekat</label>
<input class="t" id="lt" maxlength="200" autocomplete="off" placeholder="Nama desa atau patokan">

<label for="ph">Foto (opsional)</label>
<input type="file" id="ph" accept="image/*">
<p class="note">Foto dikecilkan di perangkatmu sebelum dikirim. Jangan memotret wajah orang.</p>

<input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">

<div class="btns">
<button class="btn pri" id="go" type="submit">Kirim laporan</button>
</div>

<p class="note" id="msg" role="status"></p>

<div class="btns" id="wa-result" hidden></div>

</form>

<div class="panel" style="margin-top:14px">
<h3>Cek status laporan</h3>
<label for="cd">Kode laporan</label>
<input class="t" id="cd" placeholder="LP-XXXXXXXXXX">
<div class="btns">
<button class="btn" id="chk" type="button">Cek</button>
</div>
<p class="note" id="st"></p>
</div>

</section>
</main>

<script type="module">
const $=i=>document.getElementById(i);
let pos=null;

const DAMKAR_WA='6282192825967';

fetch('/api/contacts')
.then(r=>r.json())
.then(({rows})=>{
  for(const c of rows){
    const n=String(c.phone_intl).replace(/\D/g,'');
    const short=n.length<=4;
    const a=document.createElement('a');
    a.className='btn pri';
    a.href=(short?'tel:':'tel:+')+n;
    a.textContent='Telepon '+c.name;
    $('calls').append(a);
  }
})
.catch(()=>{});

function getPos(){
  $('gpsnote').textContent='Mengambil lokasi...';

  if(!navigator.geolocation){
    $('gpsnote').textContent='GPS tidak tersedia. Tulis nama desa atau patokan.';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    p=>{
      pos={
        lat:p.coords.latitude,
        lng:p.coords.longitude,
        acc:p.coords.accuracy
      };

      $('gpsnote').textContent=
        `Lokasi terkunci: ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)} (akurasi sekitar ${Math.round(pos.acc)} m).`;

      $('gps').hidden=true;
      $('regps').hidden=false;
    },
    e=>{
      $('gpsnote').textContent=
        e.code===1
        ?'Izin lokasi ditolak. Tulis nama desa atau patokan terdekat.'
        :'Lokasi belum didapat. Coba lagi atau tulis nama desa.';
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

$('gps').onclick=getPos;
$('regps').onclick=getPos;

async function shrink(file){
  if(!file||!file.type.startsWith('image/'))return null;

  const bmp=await createImageBitmap(file);
  const s=Math.min(1,1280/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');

  c.width=Math.round(bmp.width*s);
  c.height=Math.round(bmp.height*s);

  c.getContext('2d').drawImage(
    bmp,0,0,c.width,c.height
  );

  return new Promise(r=>c.toBlob(r,'image/jpeg',.8));
}

$('f').onsubmit=async e=>{
  e.preventDefault();

  const m=$('msg');
  const wa=$('wa-result');

  m.textContent='Mengirim laporan...';
  wa.replaceChildren();
  wa.hidden=true;
  $('go').disabled=true;

  try{
    const description=$('d').value.trim();
    const locationText=$('lt').value.trim();
    const reportPos=pos?{...pos}:null;
    const selectedPhoto=$('ph').files[0];

    if(!description){
      throw new Error('Deskripsi kejadian wajib diisi.');
    }

    const fd=new FormData();

    fd.set('description',description);
    fd.set('location_text',locationText);
    fd.set('website',$('web').value);

    if(reportPos){
      fd.set('lat',reportPos.lat);
      fd.set('lng',reportPos.lng);
    }

    const b=await shrink(selectedPhoto).catch(()=>null);

    if(b){
      fd.set('photo',b,'foto.jpg');
    }

    const r=await fetch('/api/reports',{
      method:'POST',
      body:fd
    });

    const j=await r.json().catch(()=>null);

    if(!r.ok||!j){
      throw new Error(
        (j&&j.error)||
        'Laporan gagal dicatat. Hubungi pemadam langsung untuk keadaan darurat.'
      );
    }

    m.textContent=
      `Laporan berhasil dicatat di AnsepZero. Kode laporan: ${j.id}. Silakan lanjutkan pengiriman melalui WhatsApp.`;

    const parts=[
      'LAPORAN KEJADIAN - ANSEPZERO',
      'Kode laporan: '+j.id,
      '',
      'Deskripsi kejadian:',
      description,
      '',
      'Lokasi:',
      locationText||'Belum diisi'
    ];

    if(reportPos){
      parts.push(
        '',
        'Koordinat GPS:',
        reportPos.lat.toFixed(6)+', '+reportPos.lng.toFixed(6),
        'Peta: https://maps.google.com/?q='+
        reportPos.lat+','+reportPos.lng
      );
    }

    if(selectedPhoto){
      parts.push(
        '',
        'Foto kejadian akan dilampirkan secara manual.'
      );
    }

    parts.push(
      '',
      'Laporan ini dibuat melalui website AnsepZero.'
    );

    const a=document.createElement('a');

    a.className='btn pri';
    a.href='https://wa.me/'+DAMKAR_WA+'?'+
      new URLSearchParams({
        text:parts.join('\n')
      }).toString();

    a.target='_blank';
    a.rel='noopener noreferrer';
    a.textContent='Kirim detail ke WhatsApp Damkar';

    wa.append(a);
    wa.hidden=false;

    $('f').reset();
    pos=null;

    $('gps').hidden=false;
    $('regps').hidden=true;

    $('gpsnote').textContent=
      'Lokasi hanya diminta saat kamu menekan tombol di atas.';

  }catch(x){
    m.textContent=x.message;
  }

  $('go').disabled=false;
};

$('chk').onclick=async()=>{
  try{
    const code=$('cd').value.trim().toUpperCase();

    if(!code){
      $('st').textContent='Masukkan kode laporan terlebih dahulu.';
      return;
    }

    const r=await fetch(
      '/api/reports/'+encodeURIComponent(code)
    );

    const j=await r.json().catch(()=>({}));

    $('st').textContent=
      r.ok
      ?`Status: ${j.status}`
      :(j.error||'Gagal memeriksa laporan.');

  }catch(e){
    $('st').textContent='Gagal memeriksa laporan.';
  }
};
</script>

</body>
</html>
